<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Social QR — بطاقتك الرقمية</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 20px;
    background: #f8f9fa;
    color: #111827;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 22px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 14px 40px rgba(0,0,0,.06);
  }
  .logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 22px;
    border-radius: 24px;
    background: #2563eb;
    color: #fff;
    font-size: 34px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0 0 12px; font-size: 26px; }
  p { margin: 0 auto; max-width: 390px; color: #6b7280; font-size: 15px; line-height: 1.9; }
  .chip {
    display: inline-block;
    margin-top: 26px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 13px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">QR</div>
    <h1>My Social QR</h1>
    <p>صفحات الروابط الشخصية التي تنشئها من التطبيق تظهر على روابط مثل <strong>/u/xxxxxx</strong>.</p>
    <span class="chip">افتح الرابط الموجود في بطاقتك</span>
  </main>
</body>
</html>
